name: ReclaimCompanion
options:
  bundleIdPrefix: com.appler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # The Mac app's package, for ReclaimKit: both halves compile the same wire
  # types, so an endpoint that changes shape breaks this build too.
  Reclaim:
    path: ..
targets:
  ReclaimCompanion:
    type: application
    platform: iOS
    sources:
      - path: ReclaimCompanion
    dependencies:
      - package: Reclaim
        product: ReclaimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appler.reclaim.companion
        # MARKETING_VERSION is not here: it comes from Version.xcconfig, which
        # Scripts/set_version.sh writes from the root VERSION file. Two places
        # to type a version number is one place to forget one.
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The same artwork as the Mac app, from the same generator — see
        # Scripts/make_icon.swift, which writes the square iOS wants.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # A device build needs a development team, which is nobody's business but
    # the builder's. See Signing.xcconfig.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: ReclaimCompanion/Info.plist
      properties:
        CFBundleDisplayName: Reclaim
        # Left as build-setting references rather than literals: xcodegen fills
        # this plist in once, and a version written here would be the stale copy
        # the whole arrangement exists to avoid. MARKETING_VERSION comes from
        # Version.xcconfig, which Scripts/set_version.sh writes from VERSION.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # iPhone keeps the three a phone actually rotates to — iOS ignores
        # upside-down on a phone anyway. iPad has to offer all four unless the
        # app claims it requires full screen, which a companion this small has
        # no business doing: it should sit in Split View beside anything.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Both are needed to find a Mac at all: iOS refuses mDNS unless the
        # service is listed, and refuses the local network without a reason.
        NSBonjourServices:
          - _reclaim._tcp
        NSLocalNetworkUsageDescription: Reclaim finds your Mac on this network to show what its open scans are showing.
