name: CI

# macOS runners bill at ten times the Linux rate, so this runs as little as it
# can while still checking every pushed branch:
# - push only. A pull request's head is a pushed commit, and its checks show on
#   the PR; also listening to pull_request ran everything twice per push.
# - nothing for changes to prose alone.
# - the iOS companion only when something it builds from changed (a Linux job
#   decides, which costs a tenth of asking a Mac).
on:
  push:
    branches-ignore: []      # every branch: a broken push should say so early
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# Without this, steps run under `bash -e` and a failing command piped into
# `tee` passes: a broken build or test run went unnoticed until a later step.
defaults:
  run:
    shell: bash

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      companion: ${{ steps.diff.outputs.companion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          # A new branch has no "before": compare with where it left main.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            before=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          fi
          if [ -z "$before" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "companion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$before" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(iOS/|Sources/ReclaimKit/|Package\.swift|VERSION|\.github/workflows/ci\.yml)'; then
            echo "companion=true" >> "$GITHUB_OUTPUT"
          else
            echo "companion=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, so the whole history is needed:
          # a shallow clone would number every build 1.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test 2>&1 | tee test-output.txt

      - name: Build app bundle
        # No signing identity on a runner: the script falls back to ad-hoc,
        # which is enough to prove the bundle assembles and its checks pass.
        run: ./Scripts/build_app.sh release 2>&1 | tee build-output.txt

      - name: Verify the bundle
        run: |
          set -euo pipefail
          plist=dist/Reclaim.app/Contents/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          COMMIT=$(/usr/libexec/PlistBuddy -c "Print :ReclaimSourceCommit" "$plist")

          # The build number is the commit count; anything else means the
          # checkout was shallow and the version would be wrong in a release.
          EXPECTED=$(git rev-list --count HEAD)
          if [ "$BUILD" != "$EXPECTED" ]; then
            echo "build number $BUILD does not match commit count $EXPECTED" >&2
            exit 1
          fi

          test -f dist/Reclaim.app/Contents/Resources/Reclaim.icns
          codesign --verify --strict --verbose=1 dist/Reclaim.app
          # The headless entry points are the cheapest end-to-end check there is:
          # they exercise the scanner and the volume listing for real.
          ./dist/Reclaim.app/Contents/MacOS/Reclaim --volumes
          ./dist/Reclaim.app/Contents/MacOS/Reclaim --scan . | tee scan-output.txt
          grep -q "^physical" scan-output.txt

          TESTS=$(grep -oE "Test run with [0-9]+ tests" test-output.txt | tail -1)
          {
            echo "### Reclaim $VERSION (build $BUILD)"
            echo
            echo "- commit \`$COMMIT\`"
            echo "- $TESTS"
            echo "- signature: $(codesign -dvv dist/Reclaim.app 2>&1 | grep -c Authority) authorities"
          } >> "$GITHUB_STEP_SUMMARY"

      # Only main keeps a download: a branch build is checked, not handed out.
      - name: Package for download
        if: github.ref == 'refs/heads/main'
        # Zipped with ditto rather than handed to the artifact action directly:
        # a .app is a directory, and uploading it loses the executable bit.
        run: ditto -c -k --keepParent dist/Reclaim.app dist/Reclaim.zip

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: Reclaim-app
          path: dist/Reclaim.zip
          retention-days: 14

  companion:
    # The iOS app shares ReclaimKit with the Mac app, so a change to the wire
    # types can break it from the other side of the repository. Nothing built it
    # until now, which meant that breakage arrived on somebody's phone.
    name: iOS companion
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install xcodegen
        run: brew install xcodegen

      # From the spec, on a runner that has never seen the project file: this is
      # also the check that generating it works from a clean clone.
      - name: Generate the project
        run: ./iOS/generate.sh

      - name: Build
        # For the simulator, which needs no signing identity or team — the point
        # is that it compiles, not that this runner could ship it.
        run: |
          set -euo pipefail
          # Output to a file rather than through a formatter: xcodebuild is
          # loud, and the only lines worth a runner's log are the errors, which
          # are pulled out if it fails.
          if ! xcodebuild -project iOS/ReclaimCompanion.xcodeproj \
            -scheme ReclaimCompanion \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build > ios-build.txt 2>&1; then
            grep -E "error:|warning: .* is not in the Xcode project" ios-build.txt | head -30
            exit 1
          fi
          grep -q "BUILD SUCCEEDED" ios-build.txt
          # The staleness check is only a warning during a build, but on CI a
          # file missing from the project means the spec and the tree disagree,
          # and that is worth stopping for.
          if grep -q "is not in the Xcode project" ios-build.txt; then
            grep "is not in the Xcode project" ios-build.txt
            echo "::error::the Xcode project is out of date — run ./iOS/generate.sh" >&2
            exit 1
          fi

      - name: Verify the bundle
        run: |
          set -euo pipefail
          plist=build-ios/Build/Products/Debug-iphonesimulator/ReclaimCompanion.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          # The version comes from the same VERSION file the Mac app reads, via
          # Version.xcconfig. Drift between the two apps is the thing that
          # arrangement exists to prevent, so it is worth failing on.
          EXPECTED=$(cat VERSION)
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::companion says $VERSION, VERSION says $EXPECTED" >&2
            exit 1
          fi
          # The icon has to survive the asset catalog, and iOS refuses one with
          # an alpha channel — which a rendering mistake would silently add.
          test -f build-ios/Build/Products/Debug-iphonesimulator/ReclaimCompanion.app/AppIcon60x60@2x.png
          echo "companion $VERSION built" >> "$GITHUB_STEP_SUMMARY"
